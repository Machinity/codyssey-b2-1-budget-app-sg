name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Type check (mypy --strict, mypy.ini)
        run: |
          pip install -r requirements-dev.txt
          python -m mypy
      - name: Unit tests
        run: python -m unittest -v
      - name: Exit code checks
        run: bash scripts/check_exit_codes.sh
        env:
          PYTHON: python
